<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 关注汇总</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
:root {
  --bg: #e8f6f1;
  --paper: #fffdf6;
  --ink: #1d2a28;
  --muted: #5a726c;
  --line: #1d2a28;
  --link: #0b6e99;
  --chip: #d4f0e6;
  --accent: #0f8a6a;
  --shadow: #1d2a28;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    linear-gradient(0deg, rgba(15,138,106,.04), rgba(15,138,106,.04)),
    var(--bg);
  background-size: 8px 8px, auto;
  color: var(--ink);
  font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 13.5px;
  line-height: 1.55;
}
.wrap { max-width: 1640px; margin: 0 auto; padding: 22px 28px 56px; }
h1 {
  font-family: "Press Start 2P", "PingFang SC", sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.7;
  margin: 0 0 10px;
  text-shadow: 3px 3px 0 #b7e4d4;
}
.meta { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
.days {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  list-style: none;
  margin: 0;
  padding: 0;
}
@media (max-width: 1400px) { .days { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .days { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px) { .days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .days { grid-template-columns: minmax(0, 1fr); } }
.days a {
  display: block;
  background: var(--paper);
  border: 3px solid var(--line);
  border-radius: 0;
  padding: 14px 14px 12px;
  color: var(--ink);
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--shadow);
  font-family: "Press Start 2P", "PingFang SC", sans-serif;
  font-size: 11px;
  line-height: 1.6;
}
.days a:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--shadow); }
.days a span { display: block; margin-top: 8px; font-family: "PingFang SC", "Noto Sans SC", sans-serif; font-size: 12px; color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>X 关注汇总</h1>
    <p class="meta">美国时间自然日一份。旧的不会覆盖。</p>
    <ul class="days">
      <li><a href="2026-08-22.html">2026-08-22<span>完整日</span></a></li>
      <li><a href="2026-08-21.html">2026-08-21<span>完整日</span></a></li>
      <li><a href="2026-08-20.html">2026-08-20<span>完整日</span></a></li>
      <li><a href="2026-08-19.html">2026-08-19<span>完整日</span></a></li>
      <li><a href="2026-08-18.html">2026-08-18<span>完整日</span></a></li>
    </ul>
  </div>
</body>
</html>
