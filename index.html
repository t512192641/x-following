<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 关注汇总</title>
  <style>
:root {
  --bg: #eceff3;
  --paper: #ffffff;
  --ink: #1c1f24;
  --muted: #5c6570;
  --line: #d7dde5;
  --link: #1d4ed8;
  --chip: #f1f4f8;
  --accent: #2a313a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a;
    --paper: #1c2026;
    --ink: #e8eaed;
    --muted: #9aa3ad;
    --line: #333a44;
    --link: #8ab4f8;
    --chip: #262c35;
    --accent: #c5cad3;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 14px;
  line-height: 1.55;
}
.wrap {
  max-width: 1640px;
  margin: 0 auto;
  padding: 20px 28px 48px;
}
h1 {
  font-size: 22px;
  font-weight: 650;
  margin: 0 0 6px;
  letter-spacing: 0.02em;
}
.meta {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.days {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  list-style: none;
  margin: 0;
  padding: 0;
}
@media (max-width: 1400px) {
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .days { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .days { grid-template-columns: minmax(0, 1fr); }
}
.days a {
  display: block;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--link);
  text-decoration: none;
}
.days a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>X 关注汇总</h1>
    <p class="meta">按美国时间自然日一份，旧的不会覆盖。PC 宽屏。</p>
    <ul class="days">
      <li><a href="2026-08-19.html">2026-08-19</a></li>
      <li><a href="2026-08-18.html">2026-08-18</a></li>
    </ul>
  </div>
</body>
</html>
